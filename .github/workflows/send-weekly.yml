# The weekly WILSY email (collectors/digest.mjs). Started daily by Supabase pg_cron; each person gets it once a week.
# Dry run by default: it reads who is due and reports what it would send, and sends and
# writes nothing. Untick "dry_run" to send through Resend and record each person's last_digest_at.
# Needs the SUPABASE_SERVICE_ROLE_KEY secret; a live run also needs RESEND_API_KEY.
# Logs name no address or search terms, because this repository's Actions logs are public.
name: Send weekly email
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (report only, send nothing)
        type: boolean
        required: false
        default: true
      max_emails:
        description: Most emails to send in this run
        required: false
        default: '50'
permissions:
  contents: read
concurrency:
  group: send-weekly
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - name: ${{ (inputs.dry_run == false || inputs.dry_run == 'false') && 'Send weekly email' || 'Dry run weekly email' }}
        env:
          SUPABASE_URL: https://pnkthqatdlozrojwefnc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Job tables move to Heroku Postgres when the repository variable WILSY_JOBS_DB is 'heroku' (collectors/pg-rest.mjs).
          JOBS_DATABASE_URL: ${{ vars.WILSY_JOBS_DB == 'heroku' && secrets.HEROKU_DATABASE_URL || '' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Signs each email's one-click unsubscribe link; the same value is set in Vercel. Without it,
          # emails link to Manage alerts instead.
          WILSY_UNSUBSCRIBE_SECRET: ${{ secrets.WILSY_UNSUBSCRIBE_SECRET }}
          # Only an explicit "false" sends; a run started without inputs stays a dry run.
          WILSY_DIGEST_SEND: ${{ (inputs.dry_run == false || inputs.dry_run == 'false') && '1' || '0' }}
          WILSY_DIGEST_MAX_EMAILS: ${{ inputs.max_emails || '50' }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing; no subscribers were read."; exit 1; fi
          if [ "$WILSY_DIGEST_SEND" = "1" ] && [ -z "$RESEND_API_KEY" ]; then echo "::error::RESEND_API_KEY is missing; add it before a live run."; exit 1; fi
          case "$WILSY_DIGEST_MAX_EMAILS" in ''|*[!0-9]*) echo "::error::max_emails must be a whole number."; exit 1;; esac
          node collectors/digest.mjs
