# Read-only checks against the production database. GitHub emails the repository owner when a run fails.
# Started at :50 every hour by Supabase pg_cron (wilsy-dispatch-live-checks); GitHub's own cron ran hours late.
name: Live checks
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read # check-freshness.mjs reads when "Collect jobs" last ran
jobs:
  production:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --omit=dev
        working-directory: .
      - name: Collectors are publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Job tables move to Heroku Postgres when the repository variable WILSY_JOBS_DB is 'heroku' (collectors/pg-rest.mjs).
          JOBS_DATABASE_URL: ${{ vars.WILSY_JOBS_DB == 'heroku' && secrets.HEROKU_DATABASE_URL || '' }}
        run: node scripts/check-freshness.mjs
      - name: Hackathon collector is verifying events
        if: ${{ !cancelled() }}
        run: node scripts/check-hackathon-freshness.mjs
      - name: Jobs API contract
        if: ${{ !cancelled() }}
        env:
          # Job tables move to Heroku Postgres when the repository variable WILSY_JOBS_DB is 'heroku' (collectors/pg-rest.mjs).
          JOBS_DATABASE_URL: ${{ vars.WILSY_JOBS_DB == 'heroku' && secrets.HEROKU_DATABASE_URL || '' }}
        run: node scripts/verify-jobs-api.mjs
      - name: Hackathons API contract
        if: ${{ !cancelled() }}
        run: node scripts/verify-hackathons-api.mjs
      - name: Website, sitemaps and cached search respond
        if: ${{ !cancelled() }}
        run: node scripts/check-site.mjs
  # Makes failures visible to the whole team, not only the owner's inbox: one open "Live checks failing"
  # issue while checks fail (a comment at most every six hours), closed automatically when they pass again.
  report:
    needs: production
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open, update or close the outage issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.production.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live checks failing"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number,title,updatedAt \
            --jq "map(select(.title == \"$title\"))[0] // empty | \"\(.number) \(.updatedAt)\"")
          number=${open%% *}; updated=${open#* }
          if [ "$RESULT" = "success" ]; then
            [ -n "$number" ] && gh issue close "$number" --comment "Recovered: every live check passed in $RUN_URL"
            exit 0
          fi
          [ "$RESULT" = "failure" ] || exit 0
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body "The hourly production checks failed: $RUN_URL

          Open the run to see which step failed (collectors, job or hackathon API, or the website and search). This issue closes itself when a later run passes."
          elif [ $(( $(date +%s) - $(date -d "$updated" +%s) )) -ge 21600 ]; then
            gh issue comment "$number" --body "Still failing: $RUN_URL"
          fi
