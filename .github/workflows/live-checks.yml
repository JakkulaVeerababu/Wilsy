# Read-only checks against the production database. GitHub emails the repository owner when a scheduled run fails.
name: Live checks
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Collectors are publishing
        run: node scripts/check-freshness.mjs
      - name: Hackathon collector is verifying events
        if: ${{ !cancelled() }}
        run: node scripts/check-hackathon-freshness.mjs
      - name: Jobs API contract
        if: ${{ !cancelled() }}
        run: node scripts/verify-jobs-api.mjs
      - name: Hackathons API contract
        if: ${{ !cancelled() }}
        run: node scripts/verify-hackathons-api.mjs
