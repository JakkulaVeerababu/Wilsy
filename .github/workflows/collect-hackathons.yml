# Hourly hackathon collector: open registrations from Unstop's public API and Devfolio.
# Adds new events, refreshes known ones and closes events whose registration has ended.
name: Collect hackathons
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency: collect-hackathons
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Collect hackathons
        env:
          SUPABASE_URL: https://pnkthqatdlozrojwefnc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing; nothing was collected."; exit 1; fi
          node collectors/hackathons.mjs
